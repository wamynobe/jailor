name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh
        env:
          CONFIG: release

      - name: Verify code signature
        run: codesign --verify --deep --strict build/Jailor.app
